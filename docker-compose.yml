# Runs the web app, the API and its PostgreSQL database locally:
#   docker compose up --build
# The web app is then at http://localhost:3001, the API at
# http://localhost:3000 and its docs at /api/docs.
# Settings come from .env (copy envexample); the database connection and
# the Ollama address are set here, because they differ inside Docker.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: leverandorvakt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leverandorvakt}
      POSTGRES_DB: leverandorvakt
    volumes:
      # Keeps the data when the containers are recreated
      - db-data:/var/lib/postgresql/data
    ports:
      # 5433 on your machine, so it does not clash with a local PostgreSQL on 5432
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leverandorvakt -d leverandorvakt"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      # Start only when the database accepts connections
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # These override the values in .env: inside Docker the database is the
      # "db" service, and Ollama runs on your machine, not in the container
      DATABASE_URL: postgres://leverandorvakt:${POSTGRES_PASSWORD:-leverandorvakt}@db:5432/leverandorvakt
      OLLAMA_HOST: ${DOCKER_OLLAMA_HOST:-http://host.docker.internal:11434}
      PORT: "3000"
    ports:
      - "3000:3000"
    extra_hosts:
      # Docker Desktop (Windows, macOS) knows host.docker.internal already;
      # this makes it work on Linux too
      - "host.docker.internal:host-gateway"

  web:
    build: ./web
    depends_on:
      # Start only when the API answers
      api:
        condition: service_healthy
    environment:
      # The web app's server calls the API inside Docker's network;
      # the browser only ever talks to the web app
      API_URL: http://api:3000
    ports:
      - "3001:3001"

volumes:
  db-data:
